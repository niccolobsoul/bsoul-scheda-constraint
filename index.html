<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>bSoul — Documento riservato</title>
  <style>
    :root {
      --bg: #F6F1E7;
      --card: #FCFAF4;
      --ink: #2F3B31;
      --muted: #6E6F62;
      --terra: #A85A42;
      --terra-dark: #944E39;
      --verde: #5C7361;
      --line: #E3DCCB;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #221E18;
        --card: #2B2620;
        --ink: #EAE3D4;
        --muted: #A79F8D;
        --terra: #C97A5B;
        --terra-dark: #B96C4E;
        --verde: #93A88F;
        --line: #3A342B;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Nova", Palatino, Georgia, serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate {
      width: min(100%, 430px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(47, 59, 49, .08);
      padding: 34px;
    }

    .label {
      margin: 0 0 10px;
      color: var(--terra);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.15;
      font-weight: 600;
    }

    p {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    form { display: grid; gap: 12px; }

    input, button {
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
    }

    input {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      padding: 0 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--terra);
      box-shadow: 0 0 0 3px rgba(168, 90, 66, .15);
    }

    button {
      border: 0;
      background: var(--terra);
      color: #FCFAF4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover, button:focus-visible { background: var(--terra-dark); }

    .error {
      min-height: 18px;
      color: #b54735;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: var(--bg);
    }

    body.unlocked {
      display: block;
      min-height: 100vh;
      padding: 0;
      overflow: hidden;
    }

    body.unlocked .gate { display: none; }
    body.unlocked iframe { display: block; }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .gate { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <main class="gate" aria-labelledby="page-title">
    <div class="label">bSoul · Documento riservato</div>
    <h1 id="page-title">Scheda Constraint — Numeri bSoul</h1>
    <p>Inserisci la password ricevuta per vedere il documento.</p>
    <form id="password-form" autocomplete="off">
      <input id="password" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button type="submit">Entra</button>
      <div class="error" id="error" role="status" aria-live="polite"></div>
    </form>
  </main>

  <iframe id="content" src="content.html" title="Scheda constraint - i numeri bSoul"></iframe>

  <script>
    const PASSWORD = "Minima05";
    const SESSION_KEY = "bsoul_scheda_constraint_auth";

    function unlock() {
      document.body.classList.add("unlocked");
    }

    if (sessionStorage.getItem(SESSION_KEY) === PASSWORD) {
      unlock();
    }

    document.getElementById("password-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      if (input.value === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, PASSWORD);
        unlock();
        return;
      }

      error.textContent = "Password non valida";
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
